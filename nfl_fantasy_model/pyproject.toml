[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nflfm"
version = "0.1.0"
description = "NFL fantasy football projection model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
model = ["scikit-learn>=1.3", "lightgbm>=4.0"]

[project.scripts]
nflfm = "nflfm.cli:main"

[tool.setuptools.packages.find]
include = ["nflfm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
